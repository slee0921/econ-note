<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ECON1220 Blank Notes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@500;600&display=swap">
<style>
/* Layout: chapter rail left + worksheet right with Study / Level 1-3 / Review tabs. Blanks are underlined inputs; red pen = correct answers after checking. */
:root{
  --bg:#eef1f5; --sheet:#ffffff; --ink:#1b2230; --muted:#5a6477; --line:#dce1ea; --rule:#e7ebf2;
  --accent:#1f3a68; --red:#c8312b; --redbg:#fdecea; --blue:#2457c5; --bluebg:#e9effc; --gold:#a8690f; --ok:#2c7a4b; --okbg:#e6f4ec; --hl:#fff3c4;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --f-pen:"Caveat","Comic Sans MS",cursive;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11141a; --sheet:#191e27; --ink:#e5e9f0; --muted:#9aa4b5; --line:#2b3341; --rule:#232a36;
  --accent:#9db6e8; --red:#ff6f66; --redbg:#3a1f1f; --blue:#7fa6ff; --bluebg:#1d2740; --gold:#e5ac55; --ok:#62c98d; --okbg:#173126; --hl:#3a3418; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141a; --sheet:#191e27; --ink:#e5e9f0; --muted:#9aa4b5; --line:#2b3341; --rule:#232a36;
  --accent:#9db6e8; --red:#ff6f66; --redbg:#3a1f1f; --blue:#7fa6ff; --bluebg:#1d2740; --gold:#e5ac55; --ok:#62c98d; --okbg:#173126; --hl:#3a3418; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
header.top h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em}
header.top h1 span{color:var(--muted);font-weight:500;font-size:14px;margin-left:8px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap;align-items:baseline}
.legend b{font-family:var(--f-pen);font-size:21px;font-weight:600}
.grid{display:grid;grid-template-columns:240px 1fr;gap:20px;align-items:start}
nav.rail{display:flex;flex-direction:column;gap:6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.chbtn{all:unset;cursor:pointer;display:grid;grid-template-columns:42px 1fr;gap:2px 10px;padding:10px 12px;border-radius:8px;border:1px solid transparent}
.chbtn:hover{background:var(--sheet)}
.chbtn:focus-visible{outline:2px solid var(--blue)}
.chbtn[aria-current="true"]{background:var(--sheet);border-color:var(--line)}
.chbtn .no{grid-row:span 2;font-family:var(--f-mono);font-size:13px;color:var(--accent);font-weight:500;padding-top:2px}
.chbtn .nm{font-size:13.5px;font-weight:600;line-height:1.35}
.chbtn .st{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.4}
.st .due{color:var(--red);font-weight:600}
main{min-width:0}
.chhead h2{margin:0 0 2px;font-size:24px;text-wrap:balance;letter-spacing:-.01em;line-height:1.3}
.chhead p{margin:0 0 14px;color:var(--muted);font-size:13.5px}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px}
.step{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;border:1px solid var(--line);display:flex;flex-direction:column;gap:0;line-height:1.35}
.step:focus-visible{outline:2px solid var(--blue)}
.step small{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.step span{font-weight:600;font-size:14px}
.step em{font-style:normal;font-size:11.5px;color:var(--muted)}
.step[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.step[aria-selected="true"] small,.step[aria-selected="true"] em{color:var(--sheet);opacity:.8}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:22px 24px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar.bottom{margin:18px 0 0}
.btn{all:unset;cursor:pointer;font-size:13.5px;font-weight:600;padding:8px 14px;border-radius:7px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);line-height:1.4}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible{outline:2px solid var(--blue)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.btn.red{color:var(--red);border-color:var(--red)}
.btn.sm{font-size:12.5px;padding:4px 10px}
.hint{color:var(--muted);font-size:13px}
.spacer{flex:1}
.score{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px}
.bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin-top:6px;min-width:180px}
.bar i{display:block;height:100%;background:var(--ok)}
.sec{margin-bottom:22px}
.sec h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 6px;font-family:var(--f-mono);font-weight:500;border-bottom:1px solid var(--rule);padding-bottom:6px}
.item{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:4px 16px;padding:9px 0;border-bottom:1px dashed var(--rule)}
.item:last-child{border-bottom:0}
.item .t{font-weight:600}
.item .d{min-width:0}
.item.weak .t{color:var(--red)}
.item.weak .t::after{content:" ●";font-size:10px;vertical-align:middle}
.item.allok .t{color:var(--ok)}
.item.anymiss .t{color:var(--red)}
.f{font-family:var(--f-mono);font-size:13px;background:var(--rule);padding:2px 6px;border-radius:4px;white-space:normal}
b.k1{font-weight:700;background:var(--hl);padding:0 2px;border-radius:2px}
span.k2{text-decoration:underline;text-decoration-color:var(--muted);text-underline-offset:3px}
/* blanks */
input.bk{font:inherit;color:var(--blue);font-weight:600;background:transparent;border:0;border-bottom:1.5px solid var(--muted);padding:0 3px;margin:0 1px;min-width:3ch;outline:none;border-radius:0}
input.bk:focus{border-bottom-color:var(--blue);background:var(--bluebg)}
input.bk.ok{border-bottom-color:var(--ok);color:var(--ok)}
input.bk.no{border-bottom-color:var(--red);color:var(--red);text-decoration:line-through;text-decoration-thickness:1px}
.pen{font:600 21px/1 var(--f-pen);color:var(--red);margin:0 4px 0 2px;cursor:pointer;white-space:nowrap}
.pen.acc{color:var(--ok)}
.pen.acc::after{content:" (accepted)";font:12px var(--f-body);color:var(--muted)}
.gblanks{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:6px;font-size:14px}
.gblanks label{display:inline-flex;align-items:baseline;gap:4px}
.gblanks b{font-weight:600;color:var(--accent)}
/* level 3 */
.l3{display:flex;flex-direction:column;gap:8px}
.l3 textarea{width:100%;min-height:64px;resize:vertical;font:15px/1.6 var(--f-body);color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:7px;padding:8px 10px;outline:none;
  background-image:repeating-linear-gradient(var(--sheet) 0 27px,var(--rule) 27px 28px);background-attachment:local;line-height:28px;padding-top:0}
.l3 textarea:focus{border-color:var(--accent)}
.ans{border-left:3px solid var(--red);background:var(--redbg);padding:8px 12px;border-radius:0 6px 6px 0}
.ans .lbl{font:600 19px/1 var(--f-pen);color:var(--red);display:block;margin-bottom:4px}
.mk{display:flex;gap:6px;align-items:center}
.mk button{all:unset;cursor:pointer;height:30px;padding:0 10px;display:inline-grid;place-items:center;border-radius:6px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.mk button:focus-visible{outline:2px solid var(--blue)}
.mk button.on.o{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.mk button.on.x{background:var(--red);border-color:var(--red);color:var(--sheet)}
.sketch{border:1.5px dashed var(--line);border-radius:8px;padding:18px;color:var(--muted);font-size:14px;max-width:460px}
/* review */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.stat{border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{font-size:22px;font-variant-numeric:tabular-nums}
.stat b.red{color:var(--red)}
table.hist{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
table.hist th,table.hist td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule)}
table.hist th{color:var(--muted);font-weight:500;font-size:12px}
.tw{overflow-x:auto}
.weakli{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 12px;border-left:3px solid var(--red);background:var(--redbg);border-radius:0 6px 6px 0;margin-bottom:8px}
.weakli .t{font-weight:600;color:var(--red)}
.weakli .d{grid-column:1;font-size:14px;min-width:0}
.weakli .btn{grid-row:1 / span 2;grid-column:2;align-self:center}
.bluepen{width:100%;min-height:130px;resize:vertical;border-radius:8px;padding:8px 12px;font:600 22px/1.3 var(--f-pen);color:var(--blue);border:1px solid var(--blue);background:var(--bluebg);outline:none}
h4{margin:22px 0 8px;font-size:15px}
.empty{color:var(--muted);font-size:14px;padding:14px;border:1px dashed var(--line);border-radius:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:9px 16px;border-radius:8px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
/* figures */
.fig{margin-top:8px;max-width:460px}
.fig.big{max-width:560px}
.fig.wide{max-width:none}
.fig svg{display:block;width:100%;height:auto;overflow:visible}
.fig text{font:10.5px var(--f-body);fill:var(--muted)}
.fig .tl{fill:var(--ink);font-weight:600}
.fig .tb{fill:var(--blue);font-weight:600}
.fig .tr{fill:var(--red);font-weight:600}
.fig .tg{fill:var(--gold);font-weight:600}
.fig .ax{stroke:var(--ink);stroke-width:1.2;fill:none}
.fig .g{stroke:var(--muted);stroke-width:.8;stroke-dasharray:3 3;fill:none}
.fig .d1{stroke:var(--blue);stroke-width:2.4;fill:none;stroke-linecap:round}
.fig .s1{stroke:var(--red);stroke-width:2.4;fill:none;stroke-linecap:round}
.fig .lr{stroke:var(--gold);stroke-width:2.4;fill:none}
.fig .fade{stroke-opacity:.38}
.fig .st{stroke:var(--red);stroke-width:1.6;fill:none}
.fig .dt{fill:var(--ink)}
.fig .arl{stroke:var(--ink);stroke-width:1.4}
.fig .arh{fill:var(--ink)}
.fig .rec{fill:var(--redbg)}
.fig .bx{fill:var(--sheet);stroke:var(--line);stroke-width:1.2}
.fig .bx2{fill:var(--bluebg);stroke:var(--blue);stroke-width:1.2}
.fig .bfill{fill:var(--accent)}
.fig .neg{fill:var(--red)}
.fig .cn{stroke:var(--muted);stroke-width:1.2;fill:none}
.fig .cf{stroke:var(--ok);stroke-width:2.2;fill:none}
.fig .cfh{fill:var(--ok)}
.fig .nd{fill:var(--sheet);stroke-width:3}
table.sum{border-collapse:collapse;width:100%;min-width:560px;font-size:13px;line-height:1.45}
table.sum th{background:var(--accent);color:var(--sheet);text-align:left;font-weight:600;padding:7px 10px;font-size:12px}
table.sum td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.sum td.gcell{width:150px;padding:4px 8px}
.fig svg.mini{width:140px;height:auto}
.fig .mini text{font-size:9.5px}
@media (max-width:860px){
  .grid{grid-template-columns:1fr}
  nav.rail{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .chbtn{grid-template-columns:auto;min-width:160px}
  .chbtn .no{grid-row:auto}
  .steps{grid-template-columns:repeat(3,1fr)}
  .stats{grid-template-columns:1fr 1fr}
}
@media (max-width:520px){
  .steps{grid-template-columns:repeat(2,1fr)}
  .item{grid-template-columns:1fr}
  .sheet{padding:16px 14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>ECON1220 Blank Notes<span>Lectures 8 – 13</span></h1>
    <div class="legend"><span><b style="color:var(--red)">Red pen</b> correct answers you missed</span><span><b style="color:var(--blue)">Blue pen</b> your own tips</span></div>
  </header>
  <div class="grid">
    <nav class="rail" id="rail" aria-label="Chapters"></nav>
    <main>
      <div class="chhead"><h2 id="chTitle"></h2><p id="chSub"></p></div>
      <div class="steps" role="tablist" id="steps"></div>
      <section class="sheet" id="pane"></section>
    </main>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
window.addEventListener("error",e=>{const p=document.getElementById("pane");if(p)p.innerHTML='<p style="color:#c8312b;font-weight:600">Error: '+(e.message||"unknown")+" (line "+(e.lineno||"?")+")</p>"});
/* Markup: [[core]] = blank in Level 1 and 2; {{extra}} = blank in Level 2 only; a|b = accepted alternatives; @...@ = formula */
const CH=[
{id:"L8",name:"GDP: Measuring Total Production and Income",short:"GDP: Production & Income",secs:[
 ["Macroeconomics",[
  ["Macroeconomics","The study of the economy as a [[whole]]: {{inflation}}, {{unemployment}}, and economic {{growth}}"],
  ["Business cycle","Alternating periods of [[expansion]] and [[recession]]. Expansion: total production and employment are {{increasing}}. Recession: they are {{decreasing}}"],
  ["Economic growth","The ability of an economy to produce [[increasing]] quantities of goods and services"],
  ["Inflation rate","The [[percentage|percent|%]] increase in the {{average}} level of prices from one year to the next"]]],
 ["GDP & the circular flow",[
  ["GDP","The [[market value]] of all [[final]] goods and services produced in a {{country}} during a {{period of time}} (typically one year). Uses market values, not {{quantities}}; only {{current}} production"],
  ["Final vs intermediate good","Final good: purchased by a {{final user}}. Intermediate good: an [[input]] into another good (a tire on a truck). Only final goods count, to avoid [[double counting]]"],
  ["Ex 8.1","Cheese is excluded because it is an {{intermediate}} good: GDP = 5,000 + 800 + 2,000 = [[$7,800|7800]]"],
  ["Circular flow","Measuring total production also measures total [[income]]. GDP = total {{expenditure}} = total income"],
  ["Factors of production & income","Labor → [[wages]], capital → [[interest]], natural resources → [[rent]], what remains → [[profit]]"],
  ["Transfer payments","Social Security, unemployment insurance. [[Not included|excluded|not counted]] in GDP: not received in exchange for {{production}} of a new good or service"],
  ["Four uses of household income","Buy {{domestic goods|domestically produced goods}}, buy [[imports]], pay [[taxes]], [[save]] (banks, stocks, bonds = the {{financial system}})"]]],
 ["Components of GDP",[
  ["Consumption (C)","Spending on {{services}}, {{nondurable}} goods, and [[durable]] goods. Household spending on new houses is in [[I|investment]], not C"],
  ["Investment (I)","[[Business fixed]] investment (factories, machinery), [[residential]] investment (new houses), changes in business [[inventories]]"],
  ["Government purchases (G)","Federal, state, local spending on goods and services. [[Transfer payments]] are excluded"],
  ["Net exports (NX)","[[Exports]] − [[imports]]. Imports are subtracted because they are not {{domestic|U.S.}} production"],
  ["GDP equation","@Y = [[C]] + [[I]] + [[G]] + [[NX]]@"],
  ["2022 shares","C [[68]]%, I {{18.5}}%, G {{17.3}}%, NX {{−3.8}}% (total $25,744B)"],
  ["Value-added method","Value added = [[selling price]] − price paid for [[intermediate goods]]. Cotton 1 + textile 2 + shirt 12 + retailer 20 = {{$35|35}} = the final price"]]],
 ["Shortcomings of GDP",[
  ["Household production","Goods and services people produce for [[themselves]] (childcare, cleaning, meals) are not counted. Distorts {{long-run}} comparisons as women entered the workforce"],
  ["Underground economy","Hidden to avoid [[taxes]] or regulation, or because [[illegal]]. At most {{10}}% of U.S. GDP; over {{50}}% in some countries (Peru)"],
  ["GDP vs well-being","Not included or not adjusted for: [[leisure]], [[pollution]], {{crime}} and social problems, {{distribution}} of income"],
  ["GDP per capita","GDP ÷ [[population]]"]]],
 ["Real vs nominal GDP",[
  ["Nominal GDP","Value of final goods and services at [[current-year|current year|current]] prices"],
  ["Real GDP","Value at [[base-year|base year]] prices. Changes reflect only changes in {{quantity|quantities}}"],
  ["Ex 8.3","2025 {{quantities}} × 2017 {{prices}}: 4,000 + 880 + 1,800 = [[$6,680|6680]]"],
  ["Chain-weighted prices","BEA since {{1996}}: [[averages]] prices of adjacent years to minimize distortion from changes in {{relative}} prices. Reported in “chained (2017) dollars”"],
  ["Real vs nominal over time","Before the 2017 base year nominal is [[lower|less|smaller|<]] than real; after it nominal is [[higher|greater|larger|>]] than real"],
  ["GDP deflator","@[[Nominal GDP]] / [[Real GDP]] × 100@. 2021 = 110.2, 2022 = 118.0 → price level up [[7.1]]%"]]],
 ["Other measures",[
  ["GNP","Final goods and services produced by U.S. [[residents]], even [[outside]] the U.S."],
  ["Depreciation","Value of [[worn-out|worn out]] machinery, equipment, and buildings"],
  ["National income","GDP − [[depreciation]] − (difference between GDP and {{GNP}})"],
  ["Personal income","Income received by [[households]]: subtract {{retained earnings}}, add [[transfer payments]] and interest on government bonds"],
  ["Disposable personal income","Personal income − personal [[taxes]]. Best measure of income households can actually {{spend}}"],
  ["Gross domestic income","GDP as the sum of [[income]] payments. 2022: wages {{52}}%, taxes/depreciation 24%, corporate profit 11%, sole proprietors 7%, interest 3%, rent 3%"]]]
]},
{id:"L9",name:"Unemployment and Inflation",short:"Unemployment & Inflation",secs:[
 ["Labor market definitions",[
  ["Household survey","Monthly Current Population Survey by the [[Census Bureau]]; the {{BLS}} uses it to compute the unemployment rate"],
  ["Employed","Worked during the [[week]] before the survey, or {{temporarily}} away (ill, vacation, strike)"],
  ["Unemployed","Did not work last week, [[available]] for work, and actively looked in the previous [[four|4]] weeks"],
  ["Labor force","[[Employed]] + [[unemployed]]"],
  ["Not in the labor force","Retirees, homemakers, full-time {{students}}, military, prisoners; people who looked in the past {{12}} months but not the past 4 weeks"],
  ["Discouraged workers","Available for work but stopped looking because they believe [[no jobs are available|no jobs available|no jobs]]. Counted as [[not in the labor force|not in labor force]]"],
  ["Unemployment rate","@[[Unemployed]] / [[Labor force]] × 100@"],
  ["Labor force participation rate","@[[Labor force]] / [[Working-age population|working age population]] × 100@"],
  ["Employment–population ratio","@[[Employed]] / {{Working-age population|working age population}} × 100@"],
  ["Ex 9.1 Include the military","Unemployment rate [[↓]]; participation rate [[↑]] and employment–population ratio {{↑}}"]]],
 ["Measurement problems & trends",[
  ["Understates joblessness","[[Discouraged workers]] are not counted; [[part-time]] workers who want full-time jobs are counted as employed"],
  ["Overstates joblessness","Some people claim to be [[actively looking]] but aren't; some work [[illegally]] or conceal jobs to avoid {{taxes}}"],
  ["Official vs broader measure","[[U-3]] = official rate; [[U-6]] = broader, adds discouraged and involuntary part-time workers"],
  ["Participation trends","Men [[87]]% (1948) → [[68]]% (2022); women {{33}}% → {{57}}%; overall 59% → 63% (2023)"],
  ["Duration of unemployment","In expansions about {{20}}% are jobless > 6 months; in 2010 and Jan 2021 about [[40]]%"],
  ["Establishment survey","About {{300,000|300000}} establishments. Drawbacks: no [[self-employed]], misses {{new firms}}, no [[unemployment]] data, large {{revisions}}. Advantage: based on actual [[payrolls]]"],
  ["Labor market churn","The process of [[creating]] and [[destroying]] jobs. Monthly figures are {{net}} changes"],
  ["AHE vs ECI","AHE excludes [[benefits]] and suffers from {{composition}} effects. ECI includes benefits and holds the {{occupation mix|mix of occupations}} constant"]]],
 ["Types of unemployment",[
  ["Frictional unemployment","[[Short-term]] unemployment from [[matching]] workers with jobs. Some is good: it increases {{efficiency}}"],
  ["Seasonal unemployment","Due to [[weather]], tourism, and other {{calendar}}-related events. BLS reports {{seasonally adjusted}} rates"],
  ["Structural unemployment","[[Persistent]] mismatch between workers' [[skills]] and job requirements"],
  ["Cyclical unemployment","Caused by a business cycle [[recession]]"],
  ["Full employment / natural rate","Only [[frictional]] + [[structural]] unemployment remain. Natural rate ≈ {{4}}%–{{5}}%"]]],
 ["Explaining unemployment",[
  ["Government policies","Job fairs reduce [[frictional]] unemployment; [[retraining]] programs reduce {{structural}} unemployment"],
  ["Unemployment insurance","Eases hardship and recessions, but lengthens job [[search]] → raises the unemployment rate"],
  ["Minimum wage","If set [[above]] the market wage, it causes some unemployment"],
  ["Labor unions","Wages in unionized industries are usually [[above]] the market wage"],
  ["Efficiency wage","An [[above-market|above market]] wage paid to raise {{productivity}} → unemployment even when cyclical unemployment is zero"]]],
 ["Measuring inflation",[
  ["Limits of the GDP deflator","Broadest measure, but includes [[investment]] goods (generators, machine tools); misleading for a typical {{household}}"],
  ["CPI","Average prices paid by a typical [[urban family of four|urban family]]. {{14,000|14000}} households surveyed; market basket of {{211}} goods. [[Housing]] (44.4%) is the largest"],
  ["CPI formula","@Cost of basket in [[current year|this year]] / Cost of basket in [[base year]] × 100@. 900/750 = 120, 925/750 = 123 → inflation {{2.5}}%"],
  ["Four CPI biases","[[Substitution]] bias, [[quality]] bias, [[new product]] bias, [[outlet]] bias → CPI overstates inflation by {{0.5}}–{{1}} percentage point"],
  ["PPI","Prices received by [[producers]] at all stages (intermediate goods, raw materials). An {{early warning}} of CPI changes"]]],
 ["Real variables & interest rates",[
  ["Real variable","@Nominal variable / [[Price index]] × 100@"],
  ["Ex 9.5 Real wages","2021–22 nominal AHE +{{5.4}}%; real AHE $11.30 → $11.01 = [[−2.6]]%"],

const CIRC="①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳";

const X=x=>+(44+x*2.7).toFixed(1),Y=y=>+(214-y*1.8).toFixed(1);
const SV=(l,i)=>`<svg viewBox="0 0 340 248" role="img" aria-label="${l}">${i}</svg>`;
const AX=(xl,yl)=>`<path class="ax" d="M${X(0)} ${Y(100)}V${Y(0)}H${X(100)}"/><text x="${X(100)}" y="244" text-anchor="end">${xl}</text><text x="6" y="22">${yl}</text>`;
const L=(a,b,c,d,k)=>`<line class="${k}" x1="${X(a)}" y1="${Y(b)}" x2="${X(c)}" y2="${Y(d)}"/>`;
const T=(x,y,s,k="",an="start")=>`<text class="${k}" x="${X(x)}" y="${Y(y)}" text-anchor="${an}">${s}</text>`;
const D=(x,y,lab)=>`<circle class="dt" cx="${X(x)}" cy="${Y(y)}" r="3.2"/>`+(lab?`<text class="tl" x="${X(x)+6}" y="${Y(y)-5}">${lab}</text>`:"");
const G=(x,y,xl,yl,an="middle")=>`<path class="g" d="M${X(0)} ${Y(y)}H${X(x)}V${Y(0)}"/>`+(yl?`<text x="${X(0)-4}" y="${Y(y)+3.5}" text-anchor="end">${yl}</text>`:"")+(xl?`<text x="${X(x)}" y="${Y(0)+13}" text-anchor="${an}">${xl}</text>`:"");
const ARr=(x1,y1,x2,y2)=>{const t=Math.atan2(y2-y1,x2-x1),h=7;return `<line class="arl" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><polygon class="arh" points="${x2},${y2} ${(x2-h*Math.cos(t-.45)).toFixed(1)},${(y2-h*Math.sin(t-.45)).toFixed(1)} ${(x2-h*Math.cos(t+.45)).toFixed(1)},${(y2-h*Math.sin(t+.45)).toFixed(1)}"/>`};
const AR=(a,b,c,d)=>ARr(X(a),Y(b),X(c),Y(d));
const FN=(f,a,b,k)=>{let p=[];for(let x=a;x<=b+1e-9;x+=1)p.push(X(x)+","+Y(f(x)));return `<polyline class="${k}" points="${p.join(" ")}"/>`};

const PF=x=>70*(1-Math.exp(-x/30));
const isect=(a,b)=>{const[x1,y1,x2,y2]=a,[x3,y3,x4,y4]=b,d=(x1-x2)*(y3-y4)-(y1-y2)*(x3-x4),t=((x1-x3)*(y3-y4)-(y1-y3)*(x3-x4))/d;return[x1+t*(x2-x1),y1+t*(y2-y1)]};
const xAt=(l,y)=>l[0]+(y-l[1])*(l[2]-l[0])/(l[3]-l[1]);
const sh=(l,dx)=>[l[0]+dx,l[1],l[2]+dx,l[3]];

function miniSRAS(dir){const o=dir>0?[30,80,62,24]:[70,80,102,24],n=sh(o,36*dir);
  return MSV(ML(o,"s1 fade")+ML(n,"s1")+mArr(o,n,52)+`<text class="tr" x="${o[2]}" y="17" text-anchor="middle">SRAS₁</text><text class="tr" x="${n[2]}" y="17" text-anchor="middle">SRAS₂</text>`,"P","Real GDP","SRAS shift")}

  D0=dir>0?[16,22,104,70]:[40,22,128,70];D2=sh(D0,24*dir);S=[52,82,94,12];
  return MSV(ML(S,"s1")+ML(D0,"d1 fade")+ML(D2,"d1")+MD(isect(D0,S))+MD(isect(D2,S))+mArr(D0,D2,58)+`<text class="tr" x="94" y="10" text-anchor="middle">S</text><text class="tb" x="${D0[2]}" y="${D0[3]+11}" text-anchor="end">D₁</text><text class="tb" x="${D2[2]}" y="${D2[3]+11}" text-anchor="end">D₂</text>`,"r","Loanable funds","Demand shift")}

  let h=text.replace(/\[\[(.+?)\]\]|\{\{(.+?)\}\}/g,(m,a,b)=>{const lvl=a!=null?1:2,ans=a!=null?a:b;
    if(mode==="study")return lvl===1?`<b class="k1">${first(ans)}</b>`:`<span class="k2">${first(ans)}</span>`;
    if(mode>=lvl){const k=iid+"-"+(n++);return inp(k,ans)}return first(ans)});
  return h.replace(/@(.+?)@/g,"<span class='f'>$1</span>")}
function inp(k,ans){const w=Math.max(4,Math.min(28,first(ans).length+2));return `<input class="bk" data-k="${k}" data-a="${esc(ans)}" style="width:${w}ch" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="blank">`}
function figHTML(i,mode){const w=WIDE[i.fig]||"";
  if(mode==="study"||mode==="plain")return `<div class="fig ${w}">${FIG[i.fig]()}</div>`;
  BL=[];BLV=mode;let svg;try{svg=FIG[i.fig]()}finally{}const ans=BL;BL=null;
  return `<div class="fig ${w}">${svg}</div>`+(ans.length?`<div class="gblanks">${ans.map((a,j)=>`<label><b>${CIRC[j]}</b>${inp(i.id+"-g"+j,a)}</label>`).join("")}</div>`:"")}
function bodyHTML(i,mode){return i.fig?(mode==="study"||mode==="plain"?`<div>${i.d}</div>`:"")+figHTML(i,mode):fmt(i.d,mode,i.id)}

/* ---------- state ---------- */
const KEY="econ1220-fill-v1";
let S={};try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){S={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function st(id){const d=S[id]||(S[id]={});d.v=d.v||{};d.acc=d.acc||{};d.graded=d.graded||{};d.l3=d.l3||{};d.rounds=d.rounds||[];d.weak=d.weak||[];d.blue=d.blue||"";return d}
let cur=CH[0].id,tab=0,gOnly=false;
try{const h=location.hash.slice(1);if(CH.some(c=>c.id===h))cur=h}catch(e){}
const INT=[1,3,7,14,30];
const $=s=>document.querySelector(s);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const md=s=>{const p=s.split("-");return MON[+p[1]-1]+" "+(+p[2])};
function nextDue(d){if(!d.rounds.length)return null;const last=d.rounds[d.rounds.length-1];const n=INT[Math.min(d.rounds.length-1,INT.length-1)];const t=new Date(last.date+"T00:00:00");t.setDate(t.getDate()+n);return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),1900)}
const chap=()=>CH.find(c=>c.id===cur);
const lastOf=(d,l)=>{for(let i=d.rounds.length-1;i>=0;i--)if(d.rounds[i].level===l)return d.rounds[i];return null};

function rail(){
  $("#rail").innerHTML=CH.map(c=>{const d=st(c.id),due=nextDue(d);let s="Not started";
    if(d.rounds.length){const parts=[1,2,3].map(l=>{const r=lastOf(d,l);return r?`L${l} ${r.pct}%`:null}).filter(Boolean).join(" · ");s=parts+(due?(due<=today()?` · <span class="due">review due</span>`:` · next ${md(due)}`):"")}
    return `<button class="chbtn" aria-current="${c.id===cur}" data-c="${c.id}"><span class="no">${c.id}</span><span class="nm">${c.short}</span><span class="st">${s}</span></button>`}).join("");
  document.querySelectorAll(".chbtn").forEach(b=>b.onclick=()=>{cur=b.dataset.c;tab=0;render();window.scrollTo(0,0)});
}
const TABS=[["Study","Read it all","study"],["Level 1","A few blanks",1],["Level 2","More blanks",2],["Level 3","Keywords only",3],["Review","Weak spots","review"]];
function render(){
  const c=chap();$("#chTitle").textContent=`Lecture ${c.id.slice(1)} · ${c.name}`;
  const nb=l=>c.items.reduce((s,i)=>s+(i.fig?0:(i.d.match(l===1?/\[\[/g:/\[\[|\{\{/g)||[]).length),0);
  $("#chSub").textContent=`${c.items.length} items · Level 1: ${nb(1)} text blanks · Level 2: ${nb(2)} text blanks · plus graph labels`;
  $("#steps").innerHTML=TABS.map((s,i)=>`<button class="step" role="tab" aria-selected="${i===tab}" data-s="${i}"><small>${s[0]}</small><span>${s[1]}</span></button>`).join("");
  document.querySelectorAll(".step").forEach(b=>b.onclick=()=>{tab=+b.dataset.s;render()});
  rail();const m=TABS[tab][2];
  if(m==="study")study();else if(m==="review")review();else if(m===3)level3();else level(m);
}
function sections(c,fn,filter){let last="",h="";c.items.filter(filter||(()=>true)).forEach(i=>{if(i.sec!==last){if(last)h+="</div>";last=i.sec;h+=`<div class="sec"><h3>${i.sec}</h3>`}h+=fn(i)});if(last)h+="</div>";return h}
function study(){
  const c=chap(),d=st(c.id);
  $("#pane").innerHTML=`<div class="toolbar"><button class="btn" id="go2">${gOnly?"Show everything":"Graphs only"}</button><span class="hint"><b class="k1">Highlighted</b> = blank in Level 1 · <span class="k2">underlined</span> = also blank in Level 2</span><span class="spacer"></span><button class="btn primary" id="go">Start Level 1 →</button></div>`+
    sections(c,i=>`<div class="item ${d.weak.includes(i.id)?"weak":""}"><div class="t">${i.t}</div><div class="d">${bodyHTML(i,"study")}</div></div>`,gOnly?(i=>i.fig):null);
  $("#go2").onclick=()=>{gOnly=!gOnly;study()};
  $("#go").onclick=()=>{tab=1;render();window.scrollTo(0,0)};
}
function level(L){
  const c=chap(),d=st(c.id),gk=c.id+"-"+L,graded=d.graded[gk];
  $("#pane").innerHTML=`<div class="toolbar"><div id="sc"></div><span class="spacer"></span><button class="btn" id="hint">${gOnly?"Show everything":"Graphs only"}</button><button class="btn red" id="clr">Clear answers</button><button class="btn primary" id="chk">Check answers</button></div>
  <p class="hint" style="margin:0 0 12px">Type in each blank. Graph labels are numbered ①②③ under each graph. Press Enter to jump to the next blank. Answers save as you type.</p>`+
    sections(c,i=>`<div class="item" data-i="${i.id}"><div class="t">${i.t}</div><div class="d">${bodyHTML(i,L)}</div></div>`,gOnly?(i=>i.fig):null)+
    `<div class="toolbar bottom"><span class="spacer"></span><button class="btn primary" id="chk2">Check answers</button></div>`;
  const ins=[...document.querySelectorAll("input.bk")];
  ins.forEach((el,ix)=>{const k=el.dataset.k;if(d.v[k])el.value=d.v[k];
    el.oninput=()=>{d.v[k]=el.value;save();if(el.classList.contains("ok")||el.classList.contains("no")){el.classList.remove("ok","no");const p=el.nextElementSibling;if(p&&p.classList.contains("pen"))p.remove()}};
    el.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();const n=ins[ix+1];if(n)n.focus()}}});
  const grade=(record)=>{let ok=0,tot=0;const missItems=new Set(),okItems=new Set();
    ins.forEach(el=>{const k=el.dataset.k,a=el.dataset.a,iid=k.replace(/-(g?\d+)$/,"");tot++;const p=el.nextElementSibling;if(p&&p.classList.contains("pen"))p.remove();
      const good=match(el.value,a)||d.acc[k];el.classList.toggle("ok",!!good);el.classList.toggle("no",!good);
      if(good){ok++;if(d.acc[k]&&!match(el.value,a))el.insertAdjacentHTML("afterend",`<span class="pen acc" data-k="${k}">${esc(first(a==="↑"?"↑":a==="↓"?"↓":a))}</span>`)}
      else{missItems.add(iid);el.insertAdjacentHTML("afterend",`<span class="pen" data-k="${k}" title="Click to accept your answer">${esc(first(a))}</span>`)}
      if(good)okItems.add(iid)});
    document.querySelectorAll(".item[data-i]").forEach(r=>{r.classList.toggle("anymiss",missItems.has(r.dataset.i));r.classList.toggle("allok",!missItems.has(r.dataset.i))});
    document.querySelectorAll(".pen").forEach(p=>p.onclick=()=>{const k=p.dataset.k;d.acc[k]=!d.acc[k];save();grade(false)});
    const pct=tot?Math.round(ok/tot*100):0;
    $("#sc").innerHTML=`<div class="score">${ok} / ${tot} correct · ${pct}%</div><div class="bar"><i style="width:${pct}%"></i></div>`;
    if(record){d.graded[gk]=1;const set=new Set(d.weak);missItems.forEach(x=>set.add(x));d.weak=[...set];
      if(!gOnly){d.rounds.push({date:today(),level:L,pct,miss:missItems.size});}save();rail();toast(gOnly?`Graphs: ${pct}% · missed items added to Review`:`Level ${L} saved · ${pct}% · ${missItems.size} items to review`)}
    return pct};
  $("#chk").onclick=$("#chk2").onclick=()=>{grade(true);window.scrollTo({top:0,behavior:"smooth"})};
  $("#hint").onclick=()=>{gOnly=!gOnly;level(L)};
  const cb=$("#clr");cb.onclick=()=>{if(cb.dataset.c){ins.forEach(el=>{delete d.v[el.dataset.k];delete d.acc[el.dataset.k]});delete d.graded[gk];save();level(L);toast("Answers cleared")}else{cb.dataset.c=1;cb.textContent="Clear all? Click again"}};
  if(graded)grade(false);else $("#sc").innerHTML=`<div class="score">${ins.length} blanks</div><div class="bar"><i style="width:${Math.round(ins.filter(e=>e.value.trim()).length/Math.max(1,ins.length)*100)}%"></i></div>`;
}
function level3(){
  const c=chap(),d=st(c.id);
  const row=i=>{const s=d.l3[i.id]||{};const shown=s.r;
    return `<div class="item" data-i="${i.id}"><div class="t">${i.t}</div><div class="d l3">
      ${i.fig?(shown?`<div class="ans"><span class="lbl">Red pen · original</span>${bodyHTML(i,"plain")}</div>`:`<div class="sketch">Sketch this ${i.fig.startsWith("t1")?"table":"graph"} on paper: axes, curves, shifts and labels.</div>`):`<textarea data-w="${i.id}" placeholder="Write everything you remember about “${esc(i.t)}”…">${esc(s.w||"")}</textarea>`}
      ${shown&&!i.fig?`<div class="ans"><span class="lbl">Red pen · original</span>${bodyHTML(i,"study")}</div>`:""}
      <div class="mk">${shown?`<span class="hint">Did you get it?</span><button class="o ${s.m==="ok"?"on":""}" data-m="ok">✓ Got it</button><button class="x ${s.m==="miss"?"on":""}" data-m="miss">✗ Missed</button>`:`<button class="o" data-rv="1">Reveal answer</button>`}</div></div></div>`};
  const marked=c.items.filter(i=>d.l3[i.id]&&d.l3[i.id].m).length,okN=c.items.filter(i=>d.l3[i.id]&&d.l3[i.id].m==="ok").length;
  $("#pane").innerHTML=`<div class="toolbar"><div><div class="score">Marked ${marked} / ${c.items.length} · Got ${okN}</div><div class="bar"><i style="width:${Math.round(okN/c.items.length*100)}%"></i></div></div><span class="spacer"></span><button class="btn red" id="clr">Start over</button><button class="btn primary" id="fin">Finish · Save round</button></div>
  <p class="hint" style="margin:0 0 12px">Only the keyword is shown. Write the definition, formula or numbers yourself, then reveal the original and mark yourself honestly.</p>`+sections(c,row);
  document.querySelectorAll("textarea[data-w]").forEach(t=>t.oninput=()=>{const s=d.l3[t.dataset.w]||(d.l3[t.dataset.w]={});s.w=t.value;save()});
  document.querySelectorAll(".item[data-i]").forEach(r=>{const id=r.dataset.i;
    r.querySelectorAll("[data-rv]").forEach(b=>b.onclick=()=>{const s=d.l3[id]||(d.l3[id]={});s.r=1;save();keep(level3)});
    r.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{const s=d.l3[id];s.m=s.m===b.dataset.m?"":b.dataset.m;save();keep(level3)})});
  $("#fin").onclick=()=>{const n=c.items.length,ok=c.items.filter(i=>d.l3[i.id]&&d.l3[i.id].m==="ok").length,miss=c.items.filter(i=>!(d.l3[i.id]&&d.l3[i.id].m==="ok"));
    const pct=Math.round(ok/n*100);d.rounds.push({date:today(),level:3,pct,miss:miss.length});const set=new Set(d.weak);miss.forEach(i=>{if(d.l3[i.id]&&d.l3[i.id].m==="miss")set.add(i.id)});d.weak=[...set];save();tab=4;render();toast(`Level 3 saved · ${pct}%`)};
  const cb=$("#clr");cb.onclick=()=>{if(cb.dataset.c){d.l3={};save();level3();toast("Fresh sheet")}else{cb.dataset.c=1;cb.textContent="Erase Level 3? Click again"}};
}
function keep(fn){const y=window.scrollY;fn();window.scrollTo(0,y)}
function review(){
  const c=chap(),d=st(c.id),due=nextDue(d),w=c.items.filter(i=>d.weak.includes(i.id));
  const hist=d.rounds.map((r,i)=>`<tr><td>${i+1}</td><td>${r.date}</td><td>Level ${r.level}</td><td>${r.pct}%</td><td>${r.miss}</td></tr>`).reverse().join("");
  const lv=l=>{const r=lastOf(d,l);return r?r.pct+"%":"–"};
  $("#pane").innerHTML=`<div class="stats"><div class="stat"><small>Level 1 latest</small><b>${lv(1)}</b></div><div class="stat"><small>Level 2 latest</small><b>${lv(2)}</b></div><div class="stat"><small>Level 3 latest</small><b>${lv(3)}</b></div><div class="stat"><small>Next review (1·3·7·14·30 days)</small><b class="${due&&due<=today()?"red":""}">${due?(due<=today()?"Today":md(due)):"–"}</b></div></div>
  <h4 style="color:var(--red)">Red-pen weak items (${w.length})</h4>
  ${w.length?w.map(i=>`<div class="weakli" data-i="${i.id}"><div class="t">${i.t}</div><div class="d">${bodyHTML(i,"study")}</div><button class="btn sm">Learned</button></div>`).join(""):`<div class="empty">${d.rounds.length?"No weak items right now. Come back on your next review date and try a higher level.":"Check your answers in Level 1–3 and the items you miss will collect here."}</div>`}
  <h4 style="color:var(--blue)">Blue pen · tips from practice problems</h4>
  <textarea class="bluepen" id="bp" placeholder="e.g. New houses go in I, not C!"></textarea>
  ${hist?`<h4>Round history</h4><div class="tw"><table class="hist"><tr><th>#</th><th>Date</th><th>Level</th><th>Score</th><th>Items missed</th></tr>${hist}</table></div>`:""}`;
  document.querySelectorAll(".weakli").forEach(r=>r.querySelector(".btn").onclick=()=>{d.weak=d.weak.filter(x=>x!==r.dataset.i);save();keep(review);rail()});
  const bp=$("#bp");bp.value=d.blue;bp.oninput=()=>{d.blue=bp.value;save()};
}
render();
</script>

</body>
</html>
